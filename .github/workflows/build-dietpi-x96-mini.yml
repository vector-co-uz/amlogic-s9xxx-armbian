#==========================================================================
# Description: Build DietPi for X96 Mini (Amlogic S905W)
# Base: ophub Armbian trunk image -> rebuilt for s905w-x96-mini -> DietPi-Installer
#==========================================================================

name: Build DietPi for X96 Mini (S905W)

on:
  workflow_dispatch:
    inputs:
      set_release:
        description: "Debian release"
        required: false
        default: "bookworm"
        type: choice
        options:
          - bookworm
          - trixie
      armbian_kernel:
        description: "Kernel version"
        required: false
        default: "6.1.y"
        type: choice
        options:
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
          - 6.18.y
      dtb:
        description: "Device tree (FDT in uEnv.txt)"
        required: false
        default: "meson-gxl-s905w-x96-mini.dtb"
        type: choice
        options:
          - meson-gxl-s905w-x96-mini.dtb
          - meson-gxl-s905w-p281.dtb
          - meson-gxl-s905w-tx3-mini.dtb
      no_hs200:
        description: "eMMC fix: disable HS200/DDR, limit eMMC to 52 MHz"
        required: false
        default: true
        type: boolean

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo apt-get -y install systemd-container cloud-guest-utils device-tree-compiler parted dosfstools e2fsprogs xz-utils util-linux
          sudo apt-get clean
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th

      - name: Download Armbian trunk image from ophub
        id: down
        working-directory: /builder
        run: |
          armbian_buildpath="build/output/images"
          mkdir -p "${armbian_buildpath}"
          ln -sf /builder/build ${{ github.workspace }}/build
          mkdir -p /home/runner/work/_actions/ophub/amlogic-s9xxx-armbian/main
          ln -sf /builder/build /home/runner/work/_actions/ophub/amlogic-s9xxx-armbian/main/build

          asset=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/ophub/amlogic-s9xxx-armbian/releases?per_page=30" | \
              jq -c --arg RTK "Armbian_${{ inputs.set_release }}_arm64_server_" \
              '[.[] | select(.tag_name | startswith($RTK)) | .assets[] | select((.name | contains("-trunk_")) and (.name | endswith(".img.gz")))] | sort_by(.updated_at) | reverse | .[0]')
          [[ -z "${asset}" || "${asset}" == "null" ]] && { echo "Error: no trunk image found"; exit 1; }
          name=$(echo "${asset}" | jq -r '.name')
          url=$(echo "${asset}" | jq -r '.browser_download_url')
          echo "Downloading: ${name}"
          curl -fL --retry 3 "${url}" -o "${armbian_buildpath}/${name}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Rebuild Armbian for s905w-x96-mini
        uses: ophub/amlogic-s9xxx-armbian@main
        if: ${{ steps.down.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: s905w-x96-mini
          armbian_kernel: ${{ inputs.armbian_kernel }}
          auto_kernel: true
          kernel_repo: ophub/kernel
          kernel_usage: stable
          armbian_fstype: ext4
          builder_name: ophub

      - name: Convert to DietPi
        id: dietpi
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        run: |
          ls -lh "${PACKAGED_OUTPUTPATH}"
          img=$(ls "${PACKAGED_OUTPUTPATH}"/*s905w-x96-mini*.img.gz | head -1)
          [[ -f "${img}" ]] || { echo "Error: rebuilt image not found"; exit 1; }
          kver=$(basename "${img}" | grep -oE '_[0-9]+\.[0-9]+\.[0-9]+_' | tr -d '_' | head -1)
          distro_id=7; [[ "${{ inputs.set_release }}" == "trixie" ]] && distro_id=8
          suffix="${{ inputs.set_release }}-${kver}"
          [[ "${{ inputs.no_hs200 }}" == "true" ]] && suffix="${suffix}-emmcfix"
          sudo bash .github/dietpi/convert.sh "${img}" /builder/dietpi-out "${distro_id}" "${{ inputs.dtb }}" "${{ inputs.no_hs200 }}" "${suffix}"
          echo "build_tag=DietPi_x96-mini_${{ inputs.set_release }}_$(date +%Y.%m.%d)" >> ${GITHUB_ENV}
          echo "kver=${kver}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Upload DietPi image to Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.dietpi.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: /builder/dietpi-out/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### DietPi for X96 Mini (Amlogic S905W)
            - Base: ophub Armbian `${{ inputs.set_release }}`, kernel `${{ env.kver }}`
            - DTB: `${{ inputs.dtb }}`, eMMC HS200 fix: `${{ inputs.no_hs200 }}`
            - Login: `root` / `dietpi`
            - Flash `.img.xz` to SD card (balenaEtcher / Rufus), boot with the reset button in the AV jack pressed
            - Install to eMMC (optional, back up Android first): `armbian-install`
